<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rallye Citoyen - Candidature partenaire</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar"><div class="topbar-row"><h1>Rallye Citoyen - Devenir partenaire</h1></div></header>

  <main style="max-width:600px">
    <div class="card" id="form-card">
      <p class="hint">
        Vous souhaitez proposer un atelier ou soutenir le Rallye Citoyen ? Remplissez ce
        formulaire, l'équipe organisatrice reviendra vers vous.
      </p>
      <form id="form-candidature">
        <!-- Champ invisible anti-robot : ne rien saisir ici -->
        <div style="position:absolute;left:-9999px" aria-hidden="true">
          <label>Ne pas remplir<input name="hp" tabindex="-1" autocomplete="off"></label>
        </div>

        <div style="margin-bottom:12px">
          <label style="font-size:0.85rem;color:var(--muted);display:block;margin-bottom:3px">Nom de votre structure *</label>
          <input name="nom_entite" style="width:100%" required>
        </div>
        <div style="margin-bottom:12px">
          <label style="font-size:0.85rem;color:var(--muted);display:block;margin-bottom:3px">Présentation de votre structure</label>
          <textarea name="presentation_texte" rows="4" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:0.9rem" placeholder="Ce texte pourra être repris dans le carnet participant."></textarea>
        </div>
        <div style="margin-bottom:12px">
          <label style="font-size:0.85rem;color:var(--muted);display:block;margin-bottom:3px">Besoins logistiques éventuels</label>
          <input name="besoins_logistiques" style="width:100%" placeholder="Tables, chaises, électricité...">
        </div>
        <button type="submit">Envoyer ma candidature</button>
      </form>
    </div>
    <div class="card" id="confirmation-card" style="display:none">
      <p>Merci ! Votre candidature a bien été transmise, l'équipe organisatrice reviendra vers vous.</p>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById('form-candidature').addEventListener('submit', async e => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(e.target).entries());
      const res = await apiPost('public.partenaires.candidater', payload);
      if (res.success) {
        document.getElementById('form-card').style.display = 'none';
        document.getElementById('confirmation-card').style.display = '';
      } else {
        alert('Erreur : ' + res.error.message);
      }
    });
  </script>
</body>
</html>
